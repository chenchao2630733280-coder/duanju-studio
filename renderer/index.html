<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data: https:; media-src 'self' file: blob:; connect-src 'self' https: http:; font-src 'self' data:" />
  <title>短剧工作台 · Duanju Studio</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="titlebar">
    <div class="tb-left">
      <div class="tb-logo">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
          <rect x="3" y="3" width="8" height="18" rx="2"/>
          <path d="M15 3h5a1 1 0 0 1 1 1v8M15 21h5a1 1 0 0 0 1-1v-2"/>
          <circle cx="18" cy="17" r="2.4"/>
        </svg>
      </div>
      <span class="tb-name">短剧工作台</span>
      <span class="tb-divider"></span>
      <span id="tb-project" class="tb-project">未打开项目</span>
    </div>
    <div class="tb-drag"></div>
    <div class="tb-right">
      <span id="save-state" class="save-state"><i></i>已保存</span>
      <button class="tb-btn" id="win-min" title="最小化">
        <svg viewBox="0 0 12 12" width="12" height="12"><path d="M2 6h8" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
      <button class="tb-btn" id="win-max" title="最大化">
        <svg viewBox="0 0 12 12" width="12" height="12"><rect x="2.2" y="2.2" width="7.6" height="7.6" rx="1" stroke="currentColor" stroke-width="1.2" fill="none"/></svg>
      </button>
      <button class="tb-btn tb-close" id="win-close" title="关闭">
        <svg viewBox="0 0 12 12" width="12" height="12"><path d="M2.6 2.6l6.8 6.8M9.4 2.6l-6.8 6.8" stroke="currentColor" stroke-width="1.4"/></svg>
      </button>
    </div>
  </div>

  <div id="app">
    <aside id="sidebar"></aside>
    <main id="view"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <script src="js/util.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/generator.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/views/projects.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/topics.js"></script>
  <script src="js/views/topic.js"></script>
  <script src="js/views/step.js"></script>
  <script src="js/views/characters.js"></script>
  <script src="js/views/outline.js"></script>
  <script src="js/views/scripts.js"></script>
  <script src="js/views/storyboard.js"></script>
  <script src="js/views/assets.js"></script>
  <script src="js/views/models.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
